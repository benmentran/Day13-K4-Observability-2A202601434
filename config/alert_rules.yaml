alerts:
  - name: high_error_rate
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    owner: sre-alerts
    slo: error_rate_pct
    runbook: docs/alerts.md#high-error-rate
    metric: error_rate_pct

  - name: latency_p95_slo_breach
    severity: warning
    condition: latency_p95_ms > 3000
    duration: 10m
    type: symptom-based
    owner: sre-alerts
    slo: latency_p95_ms
    runbook: docs/alerts.md#latency-breach
    metric: latency_p95_ms

  - name: daily_cost_budget_breach
    severity: warning
    condition: daily_cost_usd > 2.5
    duration: 5m
    type: symptom-based
    owner: sre-alerts
    slo: daily_cost_usd
    runbook: docs/alerts.md#daily-cost-budget-breach
    metric: daily_cost_usd
